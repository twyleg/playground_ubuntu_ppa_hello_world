name: tests
run-name: tests
on:
  workflow_call:

  push:
    branches:
      - "**"
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v3
      with:
        submodules: true
    - name: 'Install dependencies'
      run: sudo bash scripts/install_dependencies_debian_ubuntu.sh
    - name: 'Build'
      run: |
        mkdir build/
        cd build/
        cmake ..
        make -j3
    - name: 'Run tests'
      run: |
        cd build/tests/unit_tests/
        ./unit_tests

  smoke-test:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v3
      with:
        submodules: true
    - name: 'Install dependencies'
      run: sudo bash scripts/install_dependencies_debian_ubuntu.sh
    - name: 'Build'
      run: |
        mkdir build/
        cd build/
        cmake ..
        make -j3
    - name: 'Run smoke test'
      run: |
        cd build/apps/hello_world_example/
        ./hello_world_example

  build-tests-linux:
    strategy:
      fail-fast: false
      matrix:
        image: [ 'ubuntu:focal', 'ubuntu:jammy', 'debian:latest', 'archlinux:latest' ]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
    - uses: ./.github/actions/setup-test-container
      with:
        image: ${{ matrix.image }}
    - name: 'Build and install'
      run: |
        mkdir build/
        cd build/
        cmake .. -DBUILD_SHARED_LIBS=ON
        cmake --build . -- -j3
        cmake --install . --prefix /usr
    - name: 'Run smoke-test: Internal application'
      run: |
        cd build/apps/hello_world_example/
        ldd ./hello_world_example
        ./hello_world_example
    - name: 'Run smoke-test: External application - Library pulled in as submodule'
      run: |
        cd tests/build_tests/test_lib_as_local_target/
        mkdir build
        cd build/
        cmake ..
        cmake --build . -- -j3
        ldd ./test_lib_as_local_target
        ./test_lib_as_local_target
    - name: 'Run smoke-test: External application - Library pulled in as system library via find_package'
      run: |
        cd tests/build_tests/test_lib_as_system_lib/
        mkdir build
        cd build/
        cmake ..
        cmake --build . -- -j3
        ldd ./test_lib_as_system_lib
        ./test_lib_as_system_lib


